<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Expenses Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Expenses Tracker">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EDF0F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121821" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light dark;
  --bg:#EDF0F5; --surface:#FFFFFF; --ink:#18212F; --muted:#66718A;
  --line:#DCE1EB; --line-strong:#C3CBDA;
  --a:#1B8486; --b:#B03F79; --ok:#2F7D4F; --danger:#C0392B;
  --a-ink:var(--bg); --b-ink:var(--bg);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121821; --surface:#1B2330; --ink:#EEF2F8; --muted:#97A3BA;
    --line:#2A3445; --line-strong:#3A475C;
    --a:#4FC3C3; --b:#E27AAE; --ok:#6CC28E; --danger:#FF7B6B;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'Bricolage Grotesque',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  font-size:17px; line-height:1.35; -webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top);
  font-variant-numeric:tabular-nums;
}
body.noscroll{overflow:hidden}
button{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 18px calc(190px + env(safe-area-inset-bottom))}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 0 4px}
.wordmark{font-weight:700;font-size:19px;letter-spacing:-.02em;white-space:nowrap}
.top .right{display:flex;align-items:center;gap:8px}
.pill{border:1px solid var(--line-strong);background:transparent;border-radius:999px;padding:5px 12px;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:7px;cursor:pointer}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:block}
.pill[data-state="syncing"] i{background:var(--muted)}
.pill[data-state="error"] i{background:var(--danger)}
.icon-btn{width:38px;height:38px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;cursor:pointer}
.icon-btn:active{background:var(--line)}
.icon-btn svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* hero */
.hero{text-align:center;padding:14px 0 26px}
.seesaw{position:relative;height:80px;margin:10px 8px 22px}
.beam{position:absolute;left:0;right:0;top:24px;height:5px;border-radius:3px;background:var(--ink);transform:rotate(var(--tilt,0deg));transition:transform .9s cubic-bezier(.3,1.5,.5,1)}
.pan{position:absolute;top:-17px;width:39px;height:39px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:16px;color:var(--bg)}
.pan.a{left:-8px;background:var(--a);color:var(--a-ink)}
.pan.b{right:-8px;background:var(--b);color:var(--b-ink)}
.pivot{position:absolute;left:50%;top:30px;transform:translateX(-50%);border-left:15px solid transparent;border-right:15px solid transparent;border-bottom:28px solid var(--line-strong)}
.owes{margin:0;font-size:20px;font-weight:600;letter-spacing:-.01em}
.owes .na{color:var(--a)} .owes .nb{color:var(--b)}
.amount{margin:2px 0 4px;font-size:60px;line-height:1.05;font-weight:700;letter-spacing:-.035em}
.sub{margin:0 0 20px;color:var(--muted);font-size:15px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px 18px;font-weight:600;font-size:17px;cursor:pointer;background:var(--ink);color:var(--bg)}
.btn:active{opacity:.85}
.btn:disabled{opacity:.35;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line-strong)}
.btn.danger{background:transparent;color:var(--danger);border:1.5px solid var(--danger)}
.btn.small{display:inline-block;width:auto;padding:11px 26px}
.hero .btn{display:inline-block;width:auto;padding:12px 30px}

/* list */
.month{margin:6px 4px 8px;font-size:15px;font-weight:600;color:var(--muted)}
.group{background:var(--surface);border-radius:18px;overflow:hidden;margin-bottom:20px}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;padding:13px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer}
.row:first-child{border-top:0}
.row:active{background:var(--bg)}
.row.settled{opacity:.5}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;color:var(--bg)}
.avatar.ok{background:var(--ok)}
.desc{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{font-size:14px;color:var(--muted);margin-top:1px}
.amt{text-align:right}
.total{font-weight:600}
.eff{font-size:14px;margin-top:1px}
.empty{text-align:center;color:var(--muted);padding:34px 20px}
.empty b{display:block;color:var(--ink);font-size:19px;margin-bottom:4px}

.fab{position:fixed;left:50%;bottom:calc(74px + env(safe-area-inset-bottom));transform:translateX(-50%);border:0;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:600;font-size:17px;padding:15px 26px;box-shadow:0 8px 24px rgba(10,20,40,.28);cursor:pointer;display:flex;align-items:center;gap:8px;white-space:nowrap}
.fab:active{transform:translateX(-50%) scale(.97)}
.fab svg{width:18px;height:18px;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;fill:none}

/* sheet */
#sheet-root .backdrop{position:fixed;inset:0;background:rgba(8,14,26,.45);opacity:0;transition:opacity .25s;z-index:10}
#sheet-root.open .backdrop{opacity:1}
#sheet-root .sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);border-radius:24px 24px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,100%);transition:transform .28s cubic-bezier(.2,.9,.3,1);z-index:11}
#sheet-root.open .sheet{transform:translate(-50%,0)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line-strong);margin:0 auto 14px;position:relative}
.grab::before{content:'';position:absolute;inset:-14px -40px}
.sheet h2{margin:0 0 12px;font-size:21px;letter-spacing:-.02em;touch-action:none}
.grab,.sheet-x{touch-action:none}
.sheet-x{position:absolute;top:12px;right:14px;width:32px;height:32px;border-radius:50%;border:0;background:var(--bg);color:var(--muted);font-size:20px;line-height:1;cursor:pointer;display:grid;place-items:center}
.compact .field{margin-bottom:10px}
.compact .field>.lbl,.compact .field>label{margin-bottom:5px;font-size:13px}
.compact input[type=text]{min-height:44px;padding:9px 12px}
.compact .seg button{padding:10px 4px;font-size:15px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.btn-row .btn{padding:13px 10px;font-size:16px}
.textbtn{display:block;margin:8px auto 0;border:0;background:none;color:var(--danger);font-size:15px;padding:8px 12px;cursor:pointer}
.field{margin-bottom:14px}
.field>label,.field>.lbl{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
input[type=text],input[type=password],input[type=date],input[type=search],input[type=url]{
  width:100%;min-height:48px;font:inherit;font-size:17px;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);-webkit-appearance:none;appearance:none
}
input:focus-visible,button:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.money{position:relative}
.money span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.money input{padding-left:30px}
.seg{display:flex;gap:6px}
[hidden]{display:none!important}
.seg button{flex:1 1 0;min-width:0;padding:12px 4px;border-radius:12px;border:1.5px solid var(--line-strong);background:transparent;font-weight:600;cursor:pointer;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.share-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.seg.unit button{flex:none;padding:12px 18px}
.swatches{display:flex;justify-content:space-between;align-items:center;gap:6px}
.swatch{width:30px;height:30px;flex:none;border-radius:50%;border:0;padding:0;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.swatch[aria-pressed="true"],.swatch.custom.on{outline:2.5px solid var(--ink);outline-offset:2px}
.swatch.auto{width:auto;padding:0 14px;background:transparent;box-shadow:none;border:1.5px solid var(--line-strong);border-radius:999px;font-size:14px;font-weight:600}
.swatch.custom{position:relative;overflow:hidden;background:conic-gradient(#e44,#ec4,#4c6,#4cc,#46e,#c4c,#e44)}
.swatch.custom input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.preview{background:var(--bg);border-radius:12px;padding:12px 14px;font-size:15px;color:var(--muted);margin:2px 0 16px;min-height:46px}
.preview b{color:var(--ink)}
.stack{display:grid;gap:10px}
.note{font-size:14px;color:var(--muted);margin:0 0 14px}
.note a{color:var(--ink)}
.error{color:var(--danger);font-size:15px;margin:0 0 12px;min-height:0}

/* setup */
.setup{padding-top:28px}
.setup h1{font-size:34px;letter-spacing:-.03em;line-height:1.08;margin:6px 0 10px}
.setup p.lead{color:var(--muted);margin:0 0 22px}
details{margin:0 0 20px;color:var(--muted);font-size:15px}
details summary{cursor:pointer;color:var(--ink);font-weight:600;margin-bottom:6px}
details ol{padding-left:20px;margin:8px 0}
.who-btns{display:grid;gap:10px}
.who-btns .btn{text-align:left;display:flex;align-items:center;gap:12px}

#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 10px);transform:translate(-50%,-16px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:14px;font-size:15px;max-width:min(92vw,520px);z-index:30;opacity:0;visibility:hidden;pointer-events:none;transition:transform .3s,opacity .3s,visibility 0s .3s;box-shadow:0 8px 24px rgba(10,20,40,.3)}
#toast.show{transform:translate(-50%,0);opacity:1;visibility:visible;transition:transform .3s,opacity .3s,visibility 0s}
select{width:100%;min-height:48px;font:inherit;font-size:17px;padding:11px 34px 11px 14px;border-radius:12px;border:1px solid var(--line);color:var(--ink);-webkit-appearance:none;appearance:none;text-overflow:ellipsis;
  background-color:var(--bg);background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 19px) 55%,calc(100% - 13px) 55%;background-size:6px 6px;background-repeat:no-repeat}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar-in{max-width:560px;margin:0 auto;display:flex}
.tabbar button{flex:1;border:0;background:none;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.tabbar button[aria-pressed="true"]{color:var(--ink)}
.tabbar svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cats-head{display:flex;justify-content:space-between;align-items:center;margin:10px 0 12px}
.ptitle{margin:0;font-size:26px;font-weight:700;letter-spacing:-.03em}
.chip{border:1.5px solid var(--line-strong);background:transparent;border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600;cursor:pointer}
.card{background:var(--surface);border-radius:18px;padding:16px 14px 12px;margin:12px 0 22px}
.bigtotal{font-size:38px;font-weight:700;letter-spacing:-.03em;line-height:1.1;margin:2px 0 8px}
.chart{display:flex;align-items:flex-end;gap:5px;height:152px;margin-top:6px}
.bar{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;border:0;background:none;padding:0;cursor:pointer}
.bar .col{display:flex;flex-direction:column-reverse;width:100%;max-width:44px;border-radius:7px 7px 3px 3px;overflow:hidden;background:var(--line);min-height:3px;transition:opacity .2s}
.bar .col i{display:block}
.bar .val{font-size:10.5px;color:var(--muted);margin-bottom:4px;white-space:nowrap;min-height:13px}
.bar .mlabel{font-size:11.5px;color:var(--muted);margin-top:6px}
.bar.dim .col{opacity:.3}
.bar[aria-pressed="true"] .mlabel{color:var(--ink);font-weight:700}
.catrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer}
.catrow:first-child{border-top:0}
.catrow:active{background:var(--bg)}
.cname{font-weight:600}
.cbar{height:6px;border-radius:3px;background:var(--bg);margin-top:6px;overflow:hidden}
.cbar i{display:block;height:100%;border-radius:3px}
.cdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.cdot.lg{width:14px;height:14px;margin:0}
.sheet h2 .cdot{margin-right:8px}
.mrow{display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center;margin-bottom:8px;font-size:15px}
.mrow .cbar{margin:0}
.cm-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;margin-bottom:8px}
.cm-row .textbtn{margin:0;padding:8px 6px}
.cm-color{position:relative;width:34px;height:34px;border-radius:50%;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15);display:block}
.cm-color input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
.addrow{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:10px}
.addrow .btn{width:auto;padding:11px 22px}
@media (prefers-reduced-motion: reduce){
  .beam,#sheet-root .sheet,#sheet-root .backdrop,#toast{transition:none}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet-root"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* ============================================================
   Expenses Tracker — shared expense tracker for two people.
   Data lives in one JSON file in a (private) GitHub repo and is
   read/written through the GitHub Contents API.
   ============================================================ */
const CURRENCY = 'USD';
const LOCALE = 'en-US';
const DEFAULT_PATH = 'ledger.json';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) || d; } catch { return d; } };
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 10));
const fmt = c => (c / 100).toLocaleString(LOCALE, { style: 'currency', currency: CURRENCY });
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const parseDate = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const shortDate = s => parseDate(s).toLocaleDateString(LOCALE, { month: 'short', day: 'numeric' });
const monthLabel = s => parseDate(s).toLocaleDateString(LOCALE, { month: 'long', year: 'numeric' });
const parseAmount = s => { const n = parseFloat(String(s).replace(/[^0-9.]/g, '')); return isFinite(n) ? Math.round(n * 100) : 0; };

// Cents the other person owes for a custom split, from either a dollar amount or a percentage of the total.
function customOwed(f, total) {
  const v = parseFloat(String(f.share).replace(/[^0-9.]/g, ''));
  if (!isFinite(v)) return 0;
  return f.unit === '%' ? Math.round(total * v / 100) : Math.round(v * 100);
}

/* ---------- state ---------- */
let cfg = load('evenly.cfg', null);                       // { repo, path, branch, token, me }
let data = load('evenly.data', { people: [], peopleAt: 0, items: [] });
data.colors = data.colors || [null, null];       // optional custom circle colors, one per person
data.colorsAt = data.colorsAt || [0, 0];
const persist = () => localStorage.setItem('evenly.data', JSON.stringify(data));
const saveCfg = () => localStorage.setItem('evenly.cfg', JSON.stringify(cfg));
let status = { state: 'idle', msg: '', at: 0 };
let lastView = null;

const name = i => data.people[i] || '?';
const color = i => i === 0 ? 'var(--a)' : 'var(--b)';
const avatarStyle = i => `background:${color(i)};color:var(${i === 0 ? '--a-ink' : '--b-ink'})`;
const PALETTE = ['#14A3A3', '#3BA55D', '#E0A100', '#E8743B', '#DC4A4A', '#D9558F', '#8E5FD1', '#2F8BE6'];
function inkFor(hex) {
  const n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  return (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.62 ? '#18212F' : '#FFFFFF';
}
function applyColors() {
  const st = document.documentElement.style;
  [0, 1].forEach(i => {
    const k = i === 0 ? '--a' : '--b', c = data.colors[i];
    if (c) { st.setProperty(k, c); st.setProperty(k + '-ink', inkFor(c)); }
    else { st.removeProperty(k); st.removeProperty(k + '-ink'); }
  });
}
const initial = i => (name(i)[0] || '?').toUpperCase();
const active = () => data.items.filter(i => !i.deleted);
// Always look an item up by id at the moment of saving: a background sync can replace the objects in data.items.
const findItem = id => data.items.find(i => i.id === id);

/* ---------- categories ---------- */
// Categories are stored as items (type 'category') so they sync, merge and soft-delete like everything else.
const ledgerItems = () => active().filter(i => i.type === 'expense' || i.type === 'settlement');
const expenses = () => active().filter(i => i.type === 'expense');
const categories = () => active().filter(i => i.type === 'category').sort((a, b) => a.createdAt - b.createdAt);
const catAny = id => data.items.find(i => i.type === 'category' && i.id === id);   // includes removed ones so old purchases keep their label
const CAT_COLORS = ['#2F8BE6', '#3BA55D', '#E8743B', '#8E5FD1', '#14A3A3', '#D9558F', '#E0A100', '#7A8699', '#DC4A4A', '#5B6EE1'];
const DEFAULT_CATS = [['bills', 'Bills'], ['groceries', 'Groceries'], ['eating-out', 'Eating Out'], ['entertainment', 'Entertainment'],
                      ['transport', 'Transport'], ['shopping', 'Shopping'], ['travel', 'Travel'], ['home', 'Home']];
// Fixed ids and timestamps, so two phones seeding at the same time produce identical items and never duplicates.
function seedCats() {
  if (data.people.length !== 2 || data.items.some(i => i.type === 'category')) return false;
  DEFAULT_CATS.forEach(([k, n], i) => data.items.push({ id: 'cat-' + k, type: 'category', name: n, color: CAT_COLORS[i], createdAt: i + 1, updatedAt: 1 }));
  return true;
}
function catMeta(id) {
  const c = id ? catAny(id) : null;
  return c ? { name: c.name, color: c.color } : { name: 'Uncategorized', color: '#8A94A6' };
}
const catTag = it => { const c = it.cat ? catAny(it.cat) : null; return c ? `<span class="cdot" style="background:${esc(c.color)}"></span>${esc(c.name)} · ` : ''; };
// How much of a purchase belongs to one person (what they are responsible for).
function shareOf(it, person) { const e = effect(it); return person === it.paidBy ? it.amount - e.amt : e.amt; }
let syncTimer;
const scheduleSync = () => { clearTimeout(syncTimer); syncTimer = setTimeout(sync, 700); };
// Newest-change-wins merging compares updatedAt, so an edit must always be newer than the version it replaces,
// even if the two phones' clocks disagree.
const stamp = it => Math.max(Date.now(), ((it && it.updatedAt) || 0) + 1);

/* ---------- money logic ---------- */
// Who owes whom, and how much, because of a single purchase.
function effect(e) {
  const other = 1 - e.paidBy;
  let amt = 0;
  if (e.resp === 'split') amt = Math.round(e.amount / 2);
  else if (e.resp === 'custom') amt = Math.max(0, Math.min(e.owed || 0, e.amount));
  else if (e.resp === other) amt = e.amount;
  return { from: other, to: e.paidBy, amt };
}
// net > 0: person 2 owes person 1. net < 0: person 1 owes person 2.
function computeNet() {
  let net = 0;
  for (const it of active()) {
    if (it.type === 'expense') {
      const e = effect(it);
      net += e.to === 0 ? e.amt : -e.amt;
    } else if (it.type === 'settlement') {
      net += it.from === 0 ? it.amount : -it.amount;
    }
  }
  return net;
}

/* ---------- GitHub sync ---------- */
const enc = s => { let b = ''; new TextEncoder().encode(s).forEach(x => b += String.fromCharCode(x)); return btoa(b); };
const dec = b => new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\s/g, '')), c => c.charCodeAt(0)));

function ghFetch(method, body, url) {
  const u = url || `https://api.github.com/repos/${cfg.repo}/contents/${cfg.path.split('/').map(encodeURIComponent).join('/')}` +
    (method === 'GET' && cfg.branch ? `?ref=${encodeURIComponent(cfg.branch)}` : '');
  return fetch(u, {
    method, cache: 'no-store',
    headers: {
      'Authorization': `Bearer ${cfg.token}`,
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28',
      ...(body ? { 'Content-Type': 'application/json' } : {})
    },
    body: body ? JSON.stringify(body) : undefined
  });
}
async function apiError(res) {
  let m = ''; try { m = (await res.json()).message || ''; } catch {}
  if (res.status === 401) return new Error('GitHub rejected the token. Check that it is correct and has not expired.');
  if (res.status === 403) return new Error('GitHub refused access (' + (m || 'forbidden') + '). Check the token has Contents read and write.');
  if (res.status === 404) return new Error('Repository not found, or the token cannot access it.');
  return new Error(`GitHub error ${res.status}: ${m}`);
}

const sortItems = a => [...a].sort((x, y) => x.createdAt - y.createdAt || (x.id < y.id ? -1 : 1));
const serialize = d => JSON.stringify({ schema: 1, people: d.people, peopleAt: d.peopleAt || 0, colors: d.colors || [null, null], colorsAt: d.colorsAt || [0, 0], items: sortItems(d.items) }, null, 1);

function merge(local, remote) {
  const out = { people: local.people, peopleAt: local.peopleAt || 0, colors: [null, null], colorsAt: [0, 0], items: [] };
  for (const i of [0, 1]) {   // each person's color is merged on its own, newest change wins
    const lt = (local.colorsAt || [])[i] || 0, rt = (remote?.colorsAt || [])[i] || 0;
    if (rt > lt) { out.colors[i] = (remote.colors || [])[i] ?? null; out.colorsAt[i] = rt; }
    else { out.colors[i] = (local.colors || [])[i] ?? null; out.colorsAt[i] = lt; }
  }
  if (remote && remote.people && remote.people.length === 2 && (remote.peopleAt || 0) >= (local.peopleAt || 0)) {
    out.people = remote.people; out.peopleAt = remote.peopleAt || 0;
  }
  const map = new Map();
  for (const it of [...(remote?.items || []), ...local.items]) {
    const cur = map.get(it.id);
    if (!cur || it.updatedAt > cur.updatedAt) map.set(it.id, it);
  }
  out.items = [...map.values()];
  return out;
}

let syncing = false, again = false;
async function sync() {
  if (!cfg) return;
  if (syncing) { again = true; return; }
  syncing = true; setStatus('syncing');
  try {
    let done = false;
    for (let n = 0; n < 4 && !done; n++) {
      const res = await ghFetch('GET');
      let remote = null, sha = null;
      if (res.status === 200) {
        const j = await res.json();
        sha = j.sha;
        remote = JSON.parse(dec(j.content));
      } else if (res.status !== 404) throw await apiError(res);

      data = merge(data, remote); persist();
      if (data.people.length !== 2) { done = true; break; }   // waiting for names

      const out = serialize(data);
      if (remote && serialize({ people: remote.people, peopleAt: remote.peopleAt, colors: remote.colors, colorsAt: remote.colorsAt, items: remote.items || [] }) === out) { done = true; break; }

      const put = await ghFetch('PUT', {
        message: `Expenses Tracker update from ${name(cfg.me ?? 0)}`,
        content: enc(out),
        ...(sha ? { sha } : {}),
        ...(cfg.branch ? { branch: cfg.branch } : {})
      });
      if (put.ok) { done = true; break; }
      if (put.status === 409 || put.status === 422) continue;   // someone else saved first: re-merge and retry
      throw await apiError(put);
    }
    if (!done) throw new Error('Could not save after several tries. Pull to refresh and try again.');
    setStatus('ok');
  } catch (e) {
    const offline = e instanceof TypeError;
    setStatus('error', offline ? 'No connection. Changes are saved on this phone and will sync later.' : e.message);
  } finally {
    syncing = false; render();
    if (again) { again = false; sync(); }
  }
}
function setStatus(state, msg = '') { status = { state, msg, at: state === 'ok' ? Date.now() : status.at }; updateStatus(); }
function updateStatus() {
  const p = $('#pill'); if (!p) return;
  p.dataset.state = status.state;
  p.querySelector('span').textContent = status.state === 'syncing' ? 'Syncing' : status.state === 'error' ? 'Not synced' : 'Synced';
}

}

function openSheet(html) {

  const sheet = r.querySelector('.sheet'), backdrop = r.querySelector('.backdrop');
  backdrop.onclick = closeSheet;

}
// Swipe down on a sheet to dismiss it. The sheet follows the finger; a long pull or a quick flick closes it,
// otherwise it springs back. If the sheet's contents are scrolled, a downward swipe scrolls them instead.
// iOS only lets a page cancel native scrolling on the first touchmoves of a gesture, so once the sheet is at
// the top we claim any downward movement straight away (the handle and title also use touch-action: none).
function enableSwipe(sheet, backdrop) {
  let startY = 0, lastY = 0, startT = 0, dragging = false, tracking = false;
  sheet.addEventListener('touchstart', e => {
    // Never start a drag on a button or field, so a tap on Save, Delete, etc. can't be turned into a swipe.
    const onControl = !!e.target.closest('button:not(.sheet-x), input, select, textarea, label, a');
    tracking = e.touches.length === 1 && !onControl; dragging = false;
    startY = lastY = e.touches[0].clientY; startT = Date.now();
  }, { passive: true });
  sheet.addEventListener('touchmove', e => {
    if (!tracking) return;
    const y = e.touches[0].clientY;
    if (!dragging) {
      if (sheet.scrollTop > 0) { startY = y; startT = Date.now(); return; }   // contents are scrolled: let them scroll
      if (y - startY < 4) return;                                             // moving up or still: native behaviour
      dragging = true;
      sheet.style.transition = 'none'; backdrop.style.transition = 'none';
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    }
    e.preventDefault();
    lastY = y;
    const d = Math.max(0, y - startY);
    sheet.style.transform = `translate(-50%, ${d}px)`;
    backdrop.style.opacity = String(Math.max(0, 1 - d / 500));
  }, { passive: false });
  const end = () => {
    const was = dragging; tracking = false; dragging = false;
    if (!was) return;
    const dy = Math.max(0, lastY - startY), v = dy / Math.max(1, Date.now() - startT);
    sheet.style.transition = 'transform .22s ease-out'; backdrop.style.transition = 'opacity .22s';
    if (dy > 90 || (dy > 30 && v > 0.6)) {
      sheet.style.transform = 'translate(-50%, 100%)'; backdrop.style.opacity = '0';
      closeSheet();
    } else {
      sheet.style.transform = ''; backdrop.style.opacity = '';
      setTimeout(() => { sheet.style.transition = ''; backdrop.style.transition = ''; }, 250);
    }
  };
  sheet.addEventListener('touchend', end);
  sheet.addEventListener('touchcancel', end);
}
function closeSheet() {
  const r = $('#sheet-root'); r.classList.remove('open');
  document.body.classList.remove('noscroll');
  closeTimer = setTimeout(() => { r.innerHTML = ''; }, 280);
}

    <div class="field"><div class="lbl">Who paid?</div>${segHTML('x-paid', [[0, name(0)], [1, name(1)]], f.paidBy)}</div>
    <div class="field"><div class="lbl">Who is responsible?</div>${segHTML('x-resp', [['split', '50/50'], [0, name(0)], [1, name(1)], ['custom', 'Custom']], f.resp)}</div>
    <div class="field" id="x-custom" ${f.resp === 'custom' ? '' : 'hidden'}>
      <label for="x-share" id="x-share-lbl"></label>

        ${segHTML('x-unitseg', [['$', '$'], ['%', '%']], f.unit).replace('class="seg"', 'class="seg unit"')}

    <div class="preview" id="x-prev"></div>

      <button class="btn" id="x-save">${ex ? 'Save changes' : 'Add purchase'}</button>
      ${ex ? '<button class="btn danger" id="x-del">Delete purchase</button>' : ''}
    </div>`);

  const prev = () => {
    const amount = parseAmount(f.amount);
    const el = $('#x-prev');
    $('#x-share-lbl').textContent = `${name(1 - f.paidBy)}'s share of the total`;
    $('#x-unit').textContent = f.unit;
    $('#x-custom').hidden = f.resp !== 'custom';
    if (!amount) { el.textContent = 'Enter an amount to see who owes what.'; return; }
    if (f.resp === 'custom') {
      const owed = customOwed(f, amount);
      if (owed > amount) { el.textContent = "The share can't be more than the total."; return; }
      const e = effect({ amount, paidBy: f.paidBy, resp: 'custom', owed });
      el.innerHTML = e.amt
        ? `<b>${esc(name(e.from))}</b> will owe <b>${esc(name(e.to))}</b> ${fmt(e.amt)}. ${esc(name(e.to))} covers ${fmt(amount - e.amt)} of ${fmt(amount)}.`
        : `Enter ${esc(name(e.from))}'s share to see what they owe.`;
      return;
    }
    const e = effect({ amount, paidBy: f.paidBy, resp: f.resp });
    el.innerHTML = e.amt ? `<b>${esc(name(e.from))}</b> will owe <b>${esc(name(e.to))}</b> ${fmt(e.amt)}` : `No one owes anything. This is ${esc(name(f.paidBy))}'s own purchase.`;
  };
  $('#x-desc').oninput = e => f.desc = e.target.value;
  $('#x-amt').oninput = e => { f.amount = e.target.value; prev(); };
  $('#x-share').oninput = e => { f.share = e.target.value; prev(); };
  $('#x-date').onchange = e => f.date = e.target.value;
  $('#x-cat').value = f.cat;
  $('#x-cat').onchange = e => { f.cat = e.target.value; $('#x-newwrap').hidden = f.cat !== '__new'; if (f.cat === '__new') setTimeout(() => $('#x-newcat') && $('#x-newcat').focus(), 60); };
  bindSeg('x-paid', v => { f.paidBy = Number(v); prev(); });
  bindSeg('x-resp', v => { f.resp = (v === 'split' || v === 'custom') ? v : Number(v); prev(); });
  bindSeg('x-unitseg', v => { f.unit = v; prev(); });
  prev();
  if (!ex) setTimeout(() => $('#x-desc') && $('#x-desc').focus(), 350);

  $('#x-save').onclick = () => {
    const amount = parseAmount(f.amount), desc = f.desc.trim();
    const err = $('#x-err');
    if (!desc) { err.textContent = 'Add a short description.'; return; }
    if (amount <= 0) { err.textContent = 'Enter an amount greater than zero.'; return; }
    if (!f.date) { err.textContent = 'Pick a date.'; return; }
    let owed;
    if (f.resp === 'custom') {
      owed = customOwed(f, amount);
      if (!f.share.trim()) { err.textContent = `Enter ${name(1 - f.paidBy)}'s share.`; return; }
      if (owed > amount) { err.textContent = "The share can't be more than the total."; return; }
    }
    const now = Date.now();
    let catId = f.cat;
    if (catId === '__new') {
      const nm = $('#x-newcat').value.trim();
      if (!nm) { err.textContent = 'Enter a name for the new category.'; return; }
      const dupe = categories().find(c => c.name.toLowerCase() === nm.toLowerCase());
      if (dupe) catId = dupe.id;
      else {
        const c = { id: uid(), type: 'category', name: nm, color: CAT_COLORS[categories().length % CAT_COLORS.length], createdAt: now, updatedAt: now };
        data.items.push(c); catId = c.id;
      }
    }
    const fields = { desc, amount, date: f.date, paidBy: f.paidBy, resp: f.resp, owed: f.resp === 'custom' ? owed : undefined, cat: catId || undefined };
    if (ex) {
      const cur = findItem(ex.id);
      if (!cur || cur.deleted) { closeSheet(); toast('This purchase was deleted, so nothing was changed.'); render(); return; }
      Object.assign(cur, fields, { updatedAt: stamp(cur) });
    } else data.items.push({ id: uid(), type: 'expense', ...fields, createdAt: now, updatedAt: now, by: cfg.me });
    persist(); closeSheet(); render(); sync();
  };
  if (ex) armConfirm($('#x-del'), 'Tap again to delete', () => {
    const cur = findItem(ex.id);
    if (cur) { cur.deleted = true; cur.updatedAt = stamp(cur); }
    persist(); closeSheet(); render(); sync();
  });
}

/* ---------- categories tab ---------- */
let catRange = 6, catBasis = 'all', catMonth = null;
const monthKey = d => d.slice(0, 7);
function monthKeys(n) {
  const now = new Date(), out = [];
  for (let i = n - 1; i >= 0; i--) { const x = new Date(now.getFullYear(), now.getMonth() - i, 1); out.push(`${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}`); }
  return out;
}
const monthDate = k => { const [y, m] = k.split('-').map(Number); return new Date(y, m - 1, 1); };
const shortMonth = k => monthDate(k).toLocaleDateString(LOCALE, { month: 'short' });
const longMonth = k => monthDate(k).toLocaleDateString(LOCALE, { month: 'long', year: 'numeric' });
const basisAmt = it => catBasis === 'all' ? it.amount : shareOf(it, catBasis);
const basisLabel = () => catBasis === 'all' ? 'All purchases' : `${name(catBasis)}'s share`;
const compact = c => { try { return (c / 100).toLocaleString(LOCALE, { style: 'currency', currency: CURRENCY, notation: 'compact', maximumFractionDigits: 1 }); } catch { return fmt(c); } };
const segBtns = (attr, opts, val) => `<div class="seg" style="margin-bottom:10px">${opts.map(([v, l]) => `<button type="button" data-${attr}="${v}" aria-pressed="${String(v) === String(val)}">${esc(l)}</button>`).join('')}</div>`;
const periodLabel = () => catMonth ? longMonth(catMonth) : `Last ${catRange} months`;
// A purchase counts under its category, or "Uncategorized" if it has none.
const catKey = it => (it.cat && catAny(it.cat)) ? it.cat : '';

function renderCats() {
  const root = $('#page-cats'); if (!root) return;
  const keys = monthKeys(catRange);
  if (catMonth && !keys.includes(catMonth)) catMonth = null;
  const order = [...data.items.filter(i => i.type === 'category').sort((a, b) => a.createdAt - b.createdAt).map(i => i.id), ''];
  const byMonth = Object.fromEntries(keys.map(k => [k, {}]));
  for (const it of expenses()) {
    const m = byMonth[monthKey(it.date)]; if (!m) continue;
    const c = catKey(it); m[c] = (m[c] || 0) + basisAmt(it);
  }
  const totals = keys.map(k => Object.values(byMonth[k]).reduce((a, b) => a + b, 0));
  const max = Math.max(1, ...totals);
  const agg = {};
  (catMonth ? [catMonth] : keys).forEach(k => { for (const [c, v] of Object.entries(byMonth[k])) agg[c] = (agg[c] || 0) + v; });
  const grand = Object.values(agg).reduce((a, b) => a + b, 0);

  const bars = keys.map((k, i) => {
    const t = totals[i], h = t ? Math.max(3, Math.round(t / max * 100)) : 0;
    const segs = order.filter(c => byMonth[k][c]).map(c => `<i style="height:${(byMonth[k][c] / t * 100).toFixed(2)}%;background:${esc(catMeta(c).color)}"></i>`).join('');
    return `<button type="button" class="bar ${catMonth && catMonth !== k ? 'dim' : ''}" data-month="${k}" aria-pressed="${catMonth === k}" aria-label="${esc(longMonth(k))}: ${fmt(t)}">
      ${catRange <= 6 ? `<span class="val">${t ? compact(t) : ''}</span>` : ''}<span class="col" style="height:${h}px">${segs}</span><span class="mlabel">${shortMonth(k)}</span></button>`;
  }).join('');

  const rows = order.filter(c => agg[c] > 0).sort((a, b) => agg[b] - agg[a]).map(c => {
    const m = catMeta(c), pct = agg[c] / grand * 100;
    return `<button type="button" class="catrow" data-cat="${c || 'none'}"><span class="cdot lg" style="background:${esc(m.color)}"></span>
      <div><div class="cname">${esc(m.name)}</div><div class="cbar"><i style="width:${pct.toFixed(1)}%;background:${esc(m.color)}"></i></div></div>
      <div style="text-align:right"><div class="total">${fmt(agg[c])}</div><div class="meta">${Math.round(pct)}%</div></div></button>`;
  }).join('');

  root.innerHTML = `
    <div class="cats-head"><h2 class="ptitle">Spending</h2><button type="button" class="chip" data-act="manage">Manage categories</button></div>
    ${segBtns('range', [[3, '3 months'], [6, '6 months'], [12, '12 months']], catRange)}
    ${segBtns('basis', [['all', 'All'], [0, name(0)], [1, name(1)]], catBasis)}
    <div class="card">
      <div class="meta">${esc(periodLabel())} · ${esc(basisLabel())}</div>
      <div class="bigtotal">${fmt(grand)}</div>
      <div class="chart">${bars}</div>
      <p class="meta" style="text-align:center;margin:10px 0 0">${catMonth ? 'Tap the month again to see everything' : 'Tap a month to focus on it'}</p>
    </div>
    <h3 class="month">By category</h3>
    ${rows ? `<div class="group">${rows}</div>` : `<div class="empty"><b>Nothing here yet</b>Purchases you add will show up by category.</div>`}`;
}

function onCatsClick(e) {
  const t = e.target.closest('[data-range],[data-basis],[data-month],[data-cat],[data-act]'); if (!t) return;

  else if (d.basis !== undefined) catBasis = d.basis === 'all' ? 'all' : Number(d.basis);

    <div class="group" id="cd-list" style="margin-top:12px">${list.map(it => `<button type="button" class="row" data-id="${it.id}">

    input.value = ''; persist(); draw(); render(); scheduleSync();

/* ---------- export ---------- */
function csvCell(v) {
  let t = String(v ?? '');
  if (/^[=+\-@\t\r]/.test(t)) t = "'" + t;                 // stop spreadsheets treating text as a formula
  return /[",\n\r]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
}
function buildCSV() {
  const last = lastSettledAt();
  const money = c => (c / 100).toFixed(2);
  const rows = [['Type', 'Date', 'Description', 'Category', 'Paid by', 'Responsible', 'Total', 'Amount owed', 'Who owes', 'Status']];
  const items = ledgerItems().sort((x, y) => (x.date < y.date ? -1 : x.date > y.date ? 1 : x.createdAt - y.createdAt));
  for (const it of items) {
    if (it.type === 'settlement') {
      rows.push(['Settlement', it.date, `Settled up: ${name(it.from)} paid ${name(it.to)}`, '', name(it.from), '', money(it.amount), '', '', 'Settled']);
    } else {
      const e = effect(it);
      const resp = it.resp === 'split' ? 'Split 50/50'
        : it.resp === 'custom' ? `Custom (${name(e.from)} owes ${money(e.amt)})`
        : name(it.resp);
      rows.push(['Purchase', it.date, it.desc, it.cat && catAny(it.cat) ? catAny(it.cat).name : '', name(it.paidBy), resp, money(it.amount), money(e.amt), e.amt ? name(e.from) : '', it.createdAt <= last ? 'Settled' : 'Unsettled']);
    }
  }
  return rows.map(r => r.map(csvCell).join(',')).join('\r\n');
}
async function exportCSV() {
  if (!active().length) { toast('Nothing to export yet.'); return; }
  const csv = '\ufeff' + buildCSV(), fname = `expenses-${today()}.csv`;
  const file = new File([csv], fname, { type: 'text/csv' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) {   // iPhone share sheet: Save to Files, AirDrop, Mail...
      await navigator.share({ files: [file], title: 'Expenses' });
      return;
    }
  } catch (e) { if (e.name === 'AbortError') return; }
  const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  const a = document.createElement('a'); a.href = url; a.download = fname;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  toast('Exported ' + fname);
}

/* ---------- boot ---------- */
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#sheet-root').classList.contains('open')) closeSheet(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && cfg) sync(); });
window.addEventListener('online', () => { if (cfg) sync(); });
setInterval(() => { if (!document.hidden && cfg && currentView() === 'main' && !$('#sheet-root').classList.contains('open')) sync(); }, 30000);
if ('serviceWorker' in navigator) {
  // Pick up new versions quickly: check on launch and on returning to the app, and reload once when an update takes over.
  const hadController = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
    reg.update();
    document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update(); });
  }).catch(() => {});
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (hadController && !reloaded && !$('#sheet-root').classList.contains('open')) { reloaded = true; location.reload(); }
  });
}
render();
if (cfg) sync();
</script>
